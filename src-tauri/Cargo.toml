[package]
name = "typstview"
version = "0.1.0"
description = "Cross-platform Typst editor with live preview"
edition = "2021"
rust-version = "1.92"

[lib]
name = "typstview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
hayagriva = "0.10.1"
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comemo = "0.5.1"
typst = "0.15.1"
typst-ide = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-packages", "universe-packages", "system-downloader", "datetime"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
typst-svg = "0.15.1"
typst-syntax = "0.15.1"
