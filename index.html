<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TypstView</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="toolbar">
      <button data-action="new" title="New document (Mod+N)">New</button>
      <button data-action="open" title="Open a file (Mod+O)">Open</button>
      <button data-action="save" title="Save (Mod+S)">Save</button>
      <button data-action="save-as" title="Save under a new name (Mod+Shift+S)">Save As</button>
      <button data-action="export" title="Export as PDF (Mod+E)">Export PDF</button>
      <span id="filename"></span>
      <button data-action="wrap" id="wrap-button" title="Toggle line wrapping (Alt+Z)">Wrap</button>
      <span class="group" role="group" aria-label="Layout">
        <button data-action="view-editor" title="Editor only (Mod+1)">Editor</button>
        <button data-action="view-split" title="Editor and preview (Mod+2)">Split</button>
        <button data-action="view-preview" title="Preview only (Mod+3)">Preview</button>
      </span>
      <span class="group" role="group" aria-label="Preview zoom">
        <button data-action="zoom-out" title="Zoom out (Mod+-)">−</button>
        <button data-action="zoom-fit" id="zoom-label" title="Fit to width (Mod+0)">Fit</button>
        <button data-action="zoom-in" title="Zoom in (Mod+=)">+</button>
      </span>
    </header>

    <nav id="formatbar" aria-label="Formatting and insertion">
      <button data-action="bold" title="Bold (Mod+B)"><b>B</b></button>
      <button data-action="italic" title="Italic (Mod+I)"><i>I</i></button>
      <button data-action="underline" title="Underline (Mod+U)"><u>U</u></button>
      <button data-action="strike" title="Strikethrough (Mod+Shift+X)"><s>S</s></button>
      <button data-action="highlight" title="Highlight"><mark>H</mark></button>
      <button data-action="text-color" title="Text color">
        <span class="color-icon">A</span>
      </button>
      <button data-action="subscript" title="Subscript">x<sub>2</sub></button>
      <button data-action="superscript" title="Superscript">x<sup>2</sup></button>
      <button data-action="inline-code" title="Inline code"><code>&lt;/&gt;</code></button>
      <select class="menu" aria-label="Heading level">
        <option>Heading</option>
        <option value="heading-1">Heading 1 (Mod+Alt+1)</option>
        <option value="heading-2">Heading 2 (Mod+Alt+2)</option>
        <option value="heading-3">Heading 3 (Mod+Alt+3)</option>
        <option value="heading-4">Heading 4</option>
        <option value="heading-0">Plain text</option>
      </select>
      <span class="group" role="group" aria-label="Lists and blocks">
        <button data-action="bullet-list" title="Bullet list (Mod+Shift+8)">• List</button>
        <button data-action="numbered-list" title="Numbered list (Mod+Shift+7)">1. List</button>
        <button data-action="term-list" title="Term (description) list">Terms</button>
        <button data-action="quote-block" title="Wrap lines in a block quote">❝</button>
        <button data-action="code-block" title="Wrap lines in a code block">{ }</button>
        <button data-action="comment" title="Toggle comment (Mod+/)">//</button>
      </span>
      <span class="group" role="group" aria-label="Insert">
        <select class="menu" aria-label="Insert">
          <option>Insert…</option>
          <optgroup label="Editors">
            <option value="insert-equation">Equation…</option>
            <option value="insert-table">Table…</option>
            <option value="insert-figure">Figure or image…</option>
            <option value="insert-link">Link…</option>
            <option value="citations">Citations and bibliography…</option>
            <option value="insert-bibliography">Bibliography list…</option>
            <option value="insert-footnote">Footnote…</option>
            <option value="insert-quote">Quote…</option>
            <option value="insert-code">Code…</option>
            <option value="insert-outline">Outline (contents)…</option>
            <option value="symbols">Symbol…</option>
          </optgroup>
          <optgroup label="Snippets" id="snippet-group"></optgroup>
          <optgroup label="Markdown">
            <option value="paste-markdown">Paste Markdown as Typst</option>
            <option value="convert-markdown">Convert selection from Markdown</option>
          </optgroup>
        </select>
        <button data-action="symbols" title="Insert a symbol">Ω</button>
        <button data-action="edit-at-cursor" title="Open the visual editor for what is at the cursor (Mod+.)">Edit at Cursor</button>
      </span>
    </nav>

    <main id="panes" data-view="split">
      <section id="editor" aria-label="Typst source"></section>
      <div id="divider" role="separator" aria-orientation="vertical"></div>
      <section id="preview" aria-label="Preview"><div id="pages"></div></section>
    </main>

    <section id="problems" aria-label="Problems" hidden>
      <ul id="problem-list"></ul>
    </section>

    <footer id="statusbar">
      <button id="compile-status" title="Show or hide problems">Starting…</button>
      <span id="message" role="status"></span>
      <span id="page-count"></span>
      <span id="cursor-position"></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
